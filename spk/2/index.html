<body>
<header class="top"><div class="wrap"><div class="kicker">ILS Suprapubischer Katheter · Übung 2 von 5</div><h1>Übung 2: Ist ein SPK sinnvoll?</h1></div></header>
<main>
<div id="app"></div>
<script>
document.addEventListener('DOMContentLoaded', () => ILS.quiz({
  mount: '#app',
  intro: "<strong>So geht's:</strong> Lesen Sie jeden Fall. Entscheiden Sie: Ist ein SPK sinnvoll? Ist eine andere Lösung besser? Oder ist ein SPK gefährlich (Kontraindikation)? Ab 8 von 10 Punkten bekommen Sie Ihren Baustein.",
  pass: 0.8,
  baustein: 'GxcdZh0=',
  storeKey: 'ils-spk-b2',
  hint: "Lesen Sie Abschnitt 2 noch einmal, besonders die Tabelle. Ändern Sie dann die rot markierten Antworten.",
  questions: [
 {
  "type": "mc",
  "keep": true,
  "q": "Herr Novak (72) hat seit 5 Tagen einen DK. Seine Prostata-OP ist erst in 6 Wochen. Bis dahin muss der Urin abgeleitet werden.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 0,
  "explain": "Der Urin muss lange abgeleitet werden. Dann ist ein SPK besser als ein DK.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Frau Weber (67) hat Multiple Sklerose. Ihre Blase entleert sich nicht. Selbstkatheterismus geht nicht, weil ihre Hände zittern.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 0,
  "explain": "Dauerhafte Ableitung bei neurogener Blasenstörung, wenn Selbstkatheterismus nicht möglich ist: typische Indikation.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Herr Schulz (45) hat einen Beckenbruch. An der Harnröhrenöffnung ist Blut. Er kann kein Wasser lassen.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 0,
  "explain": "Ein DK ist hier kontraindiziert (Verdacht auf Harnröhrenverletzung, siehe ILS 1). Ein SPK leitet den Urin ab, ohne die Harnröhre zu berühren.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Herr Lange (58) hat eine akute Prostataentzündung mit Fieber und kann kein Wasser lassen.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 0,
  "explain": "Bei akuter Prostatitis ist ein DK kontraindiziert. Der SPK ist die richtige Ableitung.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Frau Klein (50) soll einen SPK bekommen. Ihre Blase ist leer und lässt sich nicht füllen. Im Ultraschall sieht man sie nicht.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 2,
  "explain": "Ohne gefüllte Blase liegt der Darm direkt hinter der Bauchdecke. Die Punktion wäre gefährlich.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Herr Fuchs (77) nimmt einen Gerinnungshemmer. Sein INR-Wert ist stark erhöht.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 2,
  "explain": "Bei Gerinnungsstörungen besteht Blutungsgefahr. Die Ärztin oder der Arzt entscheidet, ob und wann punktiert wird.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Frau Roth (70) hat einen bekannten Blasentumor.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 2,
  "explain": "Bei einem Blasentumor wird nicht suprapubisch punktiert (Gefahr der Tumorzell-Verschleppung, Blutung).",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Von Herrn Yilmaz (35) braucht man einmal eine sterile Urinprobe.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 1,
  "explain": "Für eine einzelne Probe reicht ein Einmalkatheter oder Mittelstrahlurin. Eine Punktion wäre viel zu aufwendig.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Frau Jansen (54) hatte eine große Unterleibs-OP. Der Urin muss einige Tage abgeleitet werden. Danach soll sie wieder selbst Wasser lassen lernen.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 0,
  "explain": "Mit SPK sind später Miktionsversuche möglich, ohne den Katheter zu ziehen.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 },
 {
  "type": "mc",
  "keep": true,
  "q": "Herr Bauer (80) ist nachts manchmal inkontinent. Sonst hat er keine Probleme beim Wasserlassen.",
  "options": [
   "SPK ist sinnvoll",
   "Kein SPK – eine andere Lösung ist besser",
   "Kein SPK – Kontraindikation (Ärztin/Arzt entscheidet)"
  ],
  "correct": 1,
  "explain": "Inkontinenz allein ist keine Indikation für einen Katheter – weder DK noch SPK. Besser: Inkontinenzmaterial, Toilettengänge.",
  "hint": "Abschnitt 2, Tabelle „Indikationen und Kontraindikationen“."
 }
]
}));
</script>
