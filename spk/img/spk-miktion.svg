<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 310' width='940' height='310' font-family='Arial, Helvetica, sans-serif'><rect width='940' height='310' fill='#ffffff'/><defs><marker id='pf' viewBox='0 0 10 10' refX='5' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#222'/></marker></defs><rect x='20' y='40' width='200' height='128' rx='14' fill='#f2f2f2' stroke='#333' stroke-width='3'/><circle cx='46' cy='68' r='15' fill='#222'/><text x='46' y='74' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>1</text><text x='68' y='74' font-size='17' font-weight='700' fill='#222' text-anchor='start'>Klemme zu</text><text x='36' y='112' font-size='15' font-weight='400' fill='#222' text-anchor='start'>SPK nach ärztlicher</text><text x='36' y='130' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Anordnung abklemmen</text><path d='M224 104.0 L248 104.0' stroke='#222' stroke-width='3' marker-end='url(#pf)'/><rect x='254' y='40' width='200' height='128' rx='14' fill='#f2f2f2' stroke='#333' stroke-width='3'/><circle cx='280' cy='68' r='15' fill='#222'/><text x='280' y='74' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>2</text><text x='302' y='74' font-size='17' font-weight='700' fill='#222' text-anchor='start'>Wasser lassen</text><text x='270' y='112' font-size='15' font-weight='400' fill='#222' text-anchor='start'>bei Harndrang selbst</text><text x='270' y='130' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Wasser lassen, messen</text><path d='M458 104.0 L482 104.0' stroke='#222' stroke-width='3' marker-end='url(#pf)'/><rect x='488' y='40' width='200' height='128' rx='14' fill='#f2f2f2' stroke='#333' stroke-width='3'/><circle cx='514' cy='68' r='15' fill='#222'/><text x='514' y='74' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>3</text><text x='536' y='74' font-size='17' font-weight='700' fill='#222' text-anchor='start'>Klemme auf</text><text x='504' y='112' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Restharn läuft über</text><text x='504' y='130' font-size='15' font-weight='400' fill='#222' text-anchor='start'>den SPK ab: messen</text><path d='M692 104.0 L716 104.0' stroke='#222' stroke-width='3' marker-end='url(#pf)'/><rect x='722' y='40' width='200' height='128' rx='14' fill='#f2f2f2' stroke='#333' stroke-width='3'/><circle cx='748' cy='68' r='15' fill='#222'/><text x='748' y='74' font-size='17' font-weight='700' fill='#fff' text-anchor='middle'>4</text><text x='770' y='74' font-size='17' font-weight='700' fill='#222' text-anchor='start'>Dokumentieren</text><text x='738' y='112' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Uhrzeit, Spontanurin,</text><text x='738' y='130' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Restharn, Befinden</text><rect x='20' y='200' width='490' height='96' rx='14' fill='#ffffff' stroke='#000' stroke-width='3'/><text x='36' y='228' font-size='16' font-weight='700' fill='#222' text-anchor='start'>❗ Klemme sofort öffnen, wenn …</text><text x='36' y='254' font-size='15' font-weight='400' fill='#222' text-anchor='start'>starke Schmerzen, Druck oder Unruhe · Urin an der</text><text x='36' y='272' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Einstichstelle · kein Wasserlassen trotz Harndrang</text><rect x='530' y='200' width='390' height='96' rx='14' fill='#e6e6e6' stroke='#333' stroke-width='3'/><text x='546' y='228' font-size='16' font-weight='700' fill='#222' text-anchor='start'>Restharn dauerhaft gering?</text><text x='546' y='254' font-size='15' font-weight='400' fill='#222' text-anchor='start'>→ Ärztin/Arzt entscheidet über die</text><text x='546' y='272' font-size='15' font-weight='400' fill='#222' text-anchor='start'>Entfernung des SPK (Grenzwert laut Anordnung)</text></svg>