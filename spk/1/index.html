<body>
<header class="top"><div class="wrap"><div class="kicker">ILS Suprapubischer Katheter · Übung 1 von 5</div><h1>Übung 1: SPK – Grundlagen und Vergleich</h1></div></header>
<main>
<div id="app"></div>
<script>
document.addEventListener('DOMContentLoaded', () => ILS.quiz({
  mount: '#app',
  intro: "<strong>So geht's:</strong> Teil A: Gilt die Aussage nur für den DK, nur für den SPK oder für beide? Teil B: 4 Fragen. Den Baustein bekommen Sie nur, wenn <strong>alle Aufgaben richtig</strong> sind.",
  pass: 1.0,
  baustein: 'CQMGbgE=',
  storeKey: 'ils-spk-b1',
  hint: "Lesen Sie Abschnitt 1 noch einmal, besonders die Vergleichstabelle. Ändern Sie dann die rot markierten Antworten.",
  questions: [
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Der Katheter geht durch die Bauchdecke in die Blase.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 1,
  "explain": "Suprapubisch = über dem Schambein durch die Bauchdecke.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Die Harnröhre kann durch den Katheter verletzt werden oder sich später verengen.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 0,
  "explain": "Beim SPK liegt kein Katheter in der Harnröhre. Das ist ein großer Vorteil.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Ein geschlossenes Ableitungssystem und ein Beutel unter Blasenniveau sind wichtig.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 2,
  "explain": "Das kennen Sie aus ILS 1 – es gilt genauso beim SPK.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Die Person kann mit liegendem Katheter versuchen, selbst Wasser zu lassen (Miktionsversuch).",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 1,
  "explain": "Beim SPK ist die Harnröhre frei. Deshalb ist ein Miktionsversuch möglich.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Pflegefachpersonen dürfen den Katheter nach ärztlicher Anordnung erstmals legen.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 0,
  "explain": "Einen DK dürfen Pflegefachpersonen nach Delegation legen. Einen SPK legt immer die Ärztin oder der Arzt (Punktion).",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Es gibt eine Einstichstelle in der Haut, die einen Verband braucht.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 1,
  "explain": "Die Einstichstelle ist eine kleine Wunde. Sie wird beobachtet und steril verbunden.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "keep": true,
  "section": "Teil A: DK, SPK oder bei beiden?",
  "q": "Harnwegsinfektionen sind möglich.",
  "options": [
   "nur DK",
   "nur SPK",
   "bei beiden"
  ],
  "correct": 2,
  "explain": "Auch beim SPK können Bakterien in die Blase gelangen – das Risiko ist aber geringer als beim DK.",
  "hint": "Abschnitt 1, Tabelle „SPK und DK im Vergleich“."
 },
 {
  "type": "mc",
  "section": "Teil B: Grundlagen",
  "q": "Was bedeutet <b>suprapubisch</b>?",
  "options": [
   "über dem Schambein",
   "unter dem Nabel, neben der Leiste",
   "durch die Harnröhre",
   "hinter der Blase"
  ],
  "correct": 0,
  "explain": "supra = über, Os pubis = Schambein.",
  "hint": "Abschnitt 1, erster Absatz."
 },
 {
  "type": "mc",
  "section": "Teil B: Grundlagen",
  "q": "Was ist <b>„Cystofix“</b>?",
  "options": [
   "Der Handelsname eines Sets für einen SPK. Viele sagen deshalb „Cystofix“ zum SPK.",
   "Ein Medikament gegen Blasenentzündung",
   "Ein Desinfektionsmittel für die Einstichstelle",
   "Eine Klemme für den Miktionsversuch"
  ],
  "correct": 0,
  "explain": "Cystofix ist ein Produktname (Firma B. Braun). Im Alltag wird der Name oft für jeden SPK benutzt.",
  "hint": "Abschnitt 1."
 },
 {
  "type": "mc",
  "section": "Teil B: Grundlagen",
  "q": "Warum ist das Infektionsrisiko beim SPK <b>geringer</b> als beim DK?",
  "options": [
   "Die Einstichstelle liegt weit weg von Harnröhre, Scheide und After. Dort gibt es weniger Keime.",
   "Der SPK ist immer aus Silber.",
   "Beim SPK braucht man keinen Urinbeutel.",
   "Der SPK wird jeden Tag gewechselt."
  ],
  "correct": 0,
  "explain": "Im Intimbereich sind viele Darm- und Hautkeime. Beim SPK ist die Eintrittsstelle weiter davon entfernt.",
  "hint": "Abschnitt 1, Vergleichstabelle."
 },
 {
  "type": "mc",
  "section": "Teil B: Grundlagen",
  "q": "Was ist beim SPK eine <b>Fistel</b>?",
  "options": [
   "Ein Kanal von der Haut bis in die Blase, der sich um den Katheter bildet",
   "Ein Riss in der Harnröhre",
   "Ein Knick im Katheter",
   "Eine Entzündung der Niere"
  ],
  "correct": 0,
  "explain": "Nach einigen Wochen ist der Kanal stabil. Dann kann der Katheter gewechselt werden.",
  "hint": "Abschnitt 1, „Die Fistel“."
 }
]
}));
</script>
