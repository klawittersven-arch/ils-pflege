<!doctype html>

<body>
<header class="top"><div class="wrap"><div class="kicker">ILS Dauerkatheter · Übung 5 von 5</div><h1>Übung 5: Pflege, Beobachtung und Entfernung</h1></div></header>
<main>
<div id="app"></div>
<script>
document.addEventListener('DOMContentLoaded', () => ILS.quiz({
  mount: '#app',
  intro: "<strong>So geht's:</strong> 12 Aussagen (richtig oder falsch) und 2 Fragen zu Fällen. Ab 12 von 14 Punkten bekommen Sie Ihren Baustein.",
  pass: 0.8,
  baustein: 'DQ4Gfho=',
  storeKey: 'ils-dk-b5',
  hint: "Lesen Sie Abschnitt 4 und 5 noch einmal. Ändern Sie dann die rot markierten Antworten.",
  questions: [
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Der Urinbeutel darf auf dem Boden stehen, wenn er unter Blasenniveau ist.",
  "correct": false,
  "explain": "Der Beutel hängt unter Blasenniveau, aber nie auf dem Boden (Keime vom Boden).",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Für eine Urinprobe trennen Sie kurz den Katheter vom Beutel.",
  "correct": false,
  "explain": "Urinproben nur über die Probeentnahmestelle (vorher desinfizieren). Das System bleibt geschlossen.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Die Indikation für den DK wird jeden Tag überprüft.",
  "correct": true,
  "explain": "Jeder Tag weniger mit DK senkt das Infektionsrisiko.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Für die Intimpflege bei liegendem DK reichen Wasser und eine pH-neutrale Waschlotion.",
  "correct": true,
  "explain": "Desinfektionsmittel werden bei der täglichen Pflege nicht routinemäßig verwendet.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Ein DK muss routinemäßig alle 7 Tage gewechselt werden.",
  "correct": false,
  "explain": "Es gibt keinen festen Wechsel-Rhythmus. Gewechselt wird nach Herstellerangabe oder bei Bedarf (z. B. Verstopfung, Infektion).",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Vor dem Entfernen klemmt man den Katheter ab, um die Blase zu trainieren.",
  "correct": false,
  "explain": "Abklemmen („Blasentraining“) wird nicht empfohlen.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Zum Entblocken lassen Sie die Flüssigkeit von selbst (passiv) in die Spritze laufen.",
  "correct": true,
  "explain": "Kräftiges Ziehen kann Falten am Ballon bilden. Diese können die Harnröhre verletzen.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Beim Leeren des Beutels hat jeder Patient ein eigenes Auffanggefäß.",
  "correct": true,
  "explain": "So werden keine Keime von Patient zu Patient übertragen.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Wenn sich der Ballon nicht entblocken lässt, ziehen Sie kräftig am Katheter.",
  "correct": false,
  "explain": "Nie ziehen! Ärztin oder Arzt informieren.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Bei alten Menschen kann neue Verwirrtheit ein Zeichen für eine Harnwegsinfektion sein.",
  "correct": true,
  "explain": "Ältere Menschen haben oft keine typischen Beschwerden. Unruhe, Verwirrtheit oder ein Sturz können Hinweise sein.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Ein DK wird am besten am späten Abend entfernt.",
  "correct": false,
  "explain": "Besser am Vormittag. Dann kann man am Tag beobachten, ob die Person wieder selbst Wasser lassen kann.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "tf",
  "section": "Teil A: Richtig oder falsch?",
  "q": "Viel trinken (wenn es erlaubt ist) hilft, Harnwegsinfektionen vorzubeugen.",
  "correct": true,
  "explain": "Viel Urin spült die Blase und den Katheter.",
  "hint": "Abschnitt 4 „Pflege bei liegendem DK“ und Abschnitt 5 „Entfernung“."
 },
 {
  "type": "mc",
  "section": "Teil B: Fallsituation",
  "q": "Frau Brandt (81) hat seit 2 Tagen einen DK. Heute ist sie unruhig und verwirrt. Der Urin ist trüb und riecht stark. Temperatur: 38,4 °C. <b>Was tun Sie?</b>",
  "options": [
   "Vitalzeichen messen, Ärztin/Arzt informieren, Beobachtungen dokumentieren",
   "Den Katheter selbst entfernen",
   "Die Blase mit Kochsalzlösung spülen",
   "Nur den Beutel wechseln und abwarten"
  ],
  "correct": 0,
  "explain": "Das sind Zeichen einer Harnwegsinfektion. Die Ärztin oder der Arzt entscheidet über Diagnostik (z. B. Urinprobe aus der Probeentnahmestelle) und Therapie.",
  "hint": "Abschnitt 4, „Beobachtung“."
 },
 {
  "type": "mc",
  "section": "Teil B: Fallsituation",
  "q": "Im Beutel von Herrn Novak ist seit 2 Stunden kein Urin dazugekommen. <b>Was prüfen Sie zuerst?</b>",
  "options": [
   "Ob der Schlauch abgeknickt ist oder Herr Novak darauf liegt",
   "Sofort einen neuen Katheter legen",
   "Den Ballon mit mehr Flüssigkeit nachblocken",
   "Nichts – das ist normal"
  ],
  "correct": 0,
  "explain": "Zuerst einfache Ursachen prüfen: Knick, Schlaufe, Lage, Beutel voll oder zu hoch. Kommt weiter kein Urin: Ärztin/Arzt informieren.",
  "hint": "Abschnitt 4, „Es kommt kein Urin?“."
 }
]
}));
</script>
