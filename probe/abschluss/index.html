ILSKonto.abschluss({
  mount: '#app', ils: 'probe', schritt: 'quiz',
  intro: '<strong>Abschlussquiz:</strong> Mindestens 3 von 4 Punkten zum Bestehen.',
  pass: 0.75,
  fragen: () => ILS.shuffle(POOL)
